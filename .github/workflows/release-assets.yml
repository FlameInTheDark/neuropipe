name: Attach release artifacts

on:
  workflow_run:
    workflows:
      - Verify and release
    types:
      - completed

permissions:
  contents: write

jobs:
  build-and-attach:
    name: Build and attach Windows artifacts
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: windows-latest

    steps:
      - name: Check out released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Find release tag
        id: release
        shell: bash
        run: |
          git fetch --tags --force
          tag="$(git tag --points-at HEAD --sort=-version:refname | head -n 1)"
          if [ -z "$tag" ]; then
            echo "No release tag was created for this commit."
            echo "has_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        if: steps.release.outputs.has_release == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
          cache: true

      - name: Set up Node
        if: steps.release.outputs.has_release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: steps.release.outputs.has_release == 'true'
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        if: steps.release.outputs.has_release == 'true'
        working-directory: frontend
        run: npm run build

      - name: Install and expose NSIS
        if: steps.release.outputs.has_release == 'true'
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress

          $candidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'NSIS'),
            (Join-Path $env:ProgramFiles 'NSIS'),
            (Join-Path $env:ChocolateyInstall 'bin')
          ) | Where-Object { Test-Path (Join-Path $_ 'makensis.exe') }

          $nsisDirectory = $candidates | Select-Object -First 1
          if (-not $nsisDirectory) {
            throw 'NSIS installation completed but makensis.exe was not found.'
          }

          $nsisDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $nsisDirectory 'makensis.exe') /VERSION

      - name: Install Wails v3 CLI
        if: steps.release.outputs.has_release == 'true'
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.8

      - name: Generate Wails v3 syso and bindings
        if: steps.release.outputs.has_release == 'true'
        shell: pwsh
        run: |
          wails3 generate syso -arch amd64 -icon build/icon.ico -manifest build/wails.exe.manifest -info build/info.json
          wails3 generate bindings

      - name: Build production binary
        if: steps.release.outputs.has_release == 'true'
        env:
          CGO_ENABLED: "1"
        run: >-
          go build -tags production -trimpath
          -ldflags "-s -w -H windowsgui -X main.appVersion=${{ steps.release.outputs.tag }}"
          -o build/bin/neuropipe.exe

      - name: Generate WebView2 bootstrapper
        if: steps.release.outputs.has_release == 'true'
        shell: pwsh
        run: |
          wails3 generate webview2bootstrapper -dir build/windows/nsis

      - name: Build NSIS installer
        if: steps.release.outputs.has_release == 'true'
        shell: pwsh
        run: |
          # Ensure the output directory exists (NSIS won't create it)
          New-Item -ItemType Directory -Path build/bin -Force

          if (-not (Test-Path build/windows/nsis/project.nsi)) {
            # Copy from Wails v3 template if project.nsi doesn't exist
            $wailsPath = (go env GOMODCACHE) + "\github.com\wailsapp\wails\v3@v3.0.0-beta.8\internal\commands\build_assets\windows\nsis\project.nsi.tmpl"
            if (Test-Path $wailsPath) {
              Copy-Item $wailsPath build/windows/nsis/project.nsi
              Write-Host "Copied project.nsi from Wails v3 template"
            } else {
              throw "project.nsi not found and Wails v3 template unavailable at $wailsPath"
            }
          }

          $makensis = Get-Command makensis.exe -ErrorAction SilentlyContinue
          if (-not $makensis) { throw 'makensis.exe not found after NSIS install step' }

          Push-Location build/windows/nsis
          & makensis.exe -DARG_WAILS_AMD64_BINARY="$env:GITHUB_WORKSPACE\build\bin\neuropipe.exe" project.nsi
          $installerExit = $LASTEXITCODE
          Pop-Location

          if ($installerExit -ne 0) {
            throw "NSIS installer build failed with exit code $installerExit"
          }

      - name: Find release artifacts
        if: steps.release.outputs.has_release == 'true'
        id: artifacts
        shell: pwsh
        run: |
          $buildDirectory = Join-Path $PWD 'build/bin'
          if (-not (Test-Path $buildDirectory)) {
            throw "Build directory $buildDirectory does not exist"
          }

          $binary = Get-ChildItem -Path $buildDirectory -File -Filter 'neuropipe.exe' | Select-Object -First 1
          if (-not $binary) {
            throw "neuropipe.exe not found in $buildDirectory"
          }
          "binary=$($binary.FullName)" >> $env:GITHUB_OUTPUT

          $installer = Get-ChildItem -Path $buildDirectory -File -Filter '*-installer.exe' | Select-Object -First 1
          if (-not $installer) {
            # NSIS outputs to build/bin/ with the pattern {name}-{arch}-installer.exe
            $installer = Get-ChildItem -Path $buildDirectory -File -Filter '*installer*' | Select-Object -First 1
          }
          if ($installer) {
            "installer=$($installer.FullName)" >> $env:GITHUB_OUTPUT
            Write-Host "Found installer: $($installer.FullName)"
          } else {
            Write-Host "Warning: No installer found in $buildDirectory"
          }

      - name: Attach executable and installer to GitHub release
        if: steps.release.outputs.has_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $binary = '${{ steps.artifacts.outputs.binary }}'
          $installer = '${{ steps.artifacts.outputs.installer }}'
          $tag = '${{ steps.release.outputs.tag }}'

          $assets = @("$binary#Neuropipe-$tag-windows-amd64.exe")
          if ($installer) {
            $assets += "$installer#Neuropipe-$tag-windows-amd64-installer.exe"
          }

          Write-Host "Uploading assets: $assets"
          gh release upload $tag @assets --clobber



