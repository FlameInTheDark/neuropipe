name: Attach release artifacts

on:
  workflow_run:
    workflows:
      - Verify and release
    types:
      - completed

permissions:
  contents: write

jobs:
  build-and-attach:
    name: Build and attach Windows artifacts
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: windows-latest

    steps:
      - name: Check out released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Find release tag
        id: release
        shell: bash
        run: |
          git fetch --tags --force
          tag="$(git tag --points-at HEAD --sort=-version:refname | head -n 1)"
          if [ -z "$tag" ]; then
            echo "No release tag was created for this commit."
            echo "has_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        if: steps.release.outputs.has_release == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
          cache: true

      - name: Set up Bun
        if: steps.release.outputs.has_release == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.22"

      - name: Install frontend dependencies
        if: steps.release.outputs.has_release == 'true'
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build frontend
        if: steps.release.outputs.has_release == 'true'
        working-directory: frontend
        run: bun run build

      - name: Install and expose NSIS
        if: steps.release.outputs.has_release == 'true'
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress

          $candidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'NSIS'),
            (Join-Path $env:ProgramFiles 'NSIS'),
            (Join-Path $env:ChocolateyInstall 'bin')
          ) | Where-Object { Test-Path (Join-Path $_ 'makensis.exe') }

          $nsisDirectory = $candidates | Select-Object -First 1
          if (-not $nsisDirectory) {
            throw 'NSIS installation completed but makensis.exe was not found.'
          }

          $nsisDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $nsisDirectory 'makensis.exe') /VERSION

      - name: Install Wails v3 CLI
        if: steps.release.outputs.has_release == 'true'
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.8

      - name: Generate Wails v3 syso and bindings
        if: steps.release.outputs.has_release == 'true'
        shell: pwsh
        run: |
          wails3 generate syso -arch amd64 -icon build/icon.ico -manifest build/wails.exe.manifest -info build/info.json
          wails3 generate bindings

      - name: Build production artifacts
        if: steps.release.outputs.has_release == 'true'
        env:
          CGO_ENABLED: "1"
        run: >-
          go build -tags production -trimpath
          -ldflags "-s -w -H windowsgui -X main.appVersion=${{ steps.release.outputs.tag }}"
          -o build/bin/neuropipe.exe

      - name: Build NSIS installer (optional)
        if: steps.release.outputs.has_release == 'true'
        shell: pwsh
        run: |
          if (Test-Path build/windows/installer.nsi) {
            $nsis = Get-Command makensis.exe -ErrorAction SilentlyContinue
            if (-not $nsis) { throw 'makensis.exe not found after NSIS install step' }
            & makensis.exe build/windows/installer.nsi
          } else {
            Write-Host 'Skipping NSIS installer: build/windows/installer.nsi not found'
          }

      - name: Find release artifacts
        if: steps.release.outputs.has_release == 'true'
        id: artifacts
        shell: pwsh
        run: |
          $buildDirectory = Join-Path $PWD 'build/bin'
          if (-not (Test-Path $buildDirectory)) {
            throw "Build directory $buildDirectory does not exist"
          }
          $binary = Get-ChildItem -Path $buildDirectory -File -Filter 'neuropipe.exe' | Select-Object -First 1
          if (-not $binary) {
            throw "neuropipe.exe not found in $buildDirectory"
          }
          "binary=$($binary.FullName)" >> $env:GITHUB_OUTPUT
          $installer = Get-ChildItem -Path $buildDirectory -File -Filter '*-installer.exe' | Select-Object -First 1
          if ($installer) {
            "installer=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          }

      - name: Attach executable and installer to GitHub release
        if: steps.release.outputs.has_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $binary = '${{ steps.artifacts.outputs.binary }}'
          $installer = '${{ steps.artifacts.outputs.installer }}'
          $tag = '${{ steps.release.outputs.tag }}'
          $assets = @("$binary#Neuropipe-$tag-windows-amd64.exe")
          if ($installer) {
            $assets += "$installer#Neuropipe-$tag-windows-amd64-installer.exe"
          }
          gh release upload $tag @assets --clobber
