name: Verify and release

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify application
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.22"

      - name: Ensure frontend/dist exists for go:embed
        shell: pwsh
        run: |
          if (-not (Test-Path frontend/dist)) {
            New-Item -ItemType Directory -Path frontend/dist -Force
            '<!DOCTYPE html><html><head><title>Neuropipe</title></head><body><div id="root"></div></body></html>' | Out-File -FilePath frontend/dist/index.html -Encoding utf8
          }

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Check frontend types
        working-directory: frontend
        run: bun run check

      - name: Build frontend
        working-directory: frontend
        run: bun run build

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.8

      - name: Generate syso for Windows version info
        shell: pwsh
        run: |
          wails3 generate syso -arch amd64 -icon build/icon.ico -manifest build/wails.exe.manifest -info build/info.json

      - name: Vet Go code
        env:
          CGO_ENABLED: "1"
        run: go vet ./...

      - name: Test Go code with the race detector
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

  release:
    name: Create semantic release
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Check out source with tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Create GitHub release from conventional commits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes semantic-release@25
