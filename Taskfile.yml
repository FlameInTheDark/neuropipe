version: '3'

includes:
  common: ./build/Taskfile.common.yml
  windows: ./build/Taskfile.windows.yml

vars:
  APP_NAME: "neuropipe"
  BIN_DIR: "bin"
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{OS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{OS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{OS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  gen:proto:
    summary: Regenerates the executor gRPC contract (requires protoc + protoc-gen-go + protoc-gen-go-grpc)
    cmds:
      - protoc --proto_path=internal/proto --go_out=paths=source_relative:internal/proto --go-grpc_out=paths=source_relative:internal/proto internal/proto/executor/v1/executor.proto

  executor:build:
    summary: Cross-compiles the standalone executor binary (pure Go, no cgo)
    env:
      CGO_ENABLED: "0"
    cmds:
      - mkdir -p bin
      - go build -trimpath -ldflags "-s -w" -o bin/neuropipe-executor{{if eq OS "windows"}}.exe{{end}} ./cmd/neuropipe-executor
